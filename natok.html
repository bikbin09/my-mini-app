
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="প্রথম প্রেমের গল্প Episode 1, বাংলা নাটক ও ওয়েব সিরিজ দেখুন।">
<title>প্রথম প্রেমের গল্প Episode 1 | FUNNYMERRAGELIFE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#fff;font-family:Arial,sans-serif;line-height:1.6}
header{text-align:center;padding:22px 10px;background:#171008;border-bottom:2px solid #ffc64b}
.logo{color:#ffc64b;font-size:24px;font-weight:900}
header p{color:#ccc;font-size:13px}
.container{max-width:800px;margin:auto;padding:14px}
.hero{text-align:center;padding:25px 5px}
.hero h1,.section-title{color:#ffc64b}
.hero h1{font-size:27px}
.hero p{color:#ccc;font-size:14px;margin-top:7px}
.categories{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:15px 0}
button,.btn{border:0;border-radius:8px;padding:12px;text-align:center;font-weight:bold;cursor:pointer;text-decoration:none;display:block;width:100%;font-size:15px}
.categories button{width:auto;background:#222;color:#ffc64b;border:1px solid #59421a}
.card{background:#121212;border:1px solid #493719;border-radius:13px;overflow:hidden;margin:15px 0 22px}
.poster{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#38250b,#090909);display:flex;align-items:center;justify-content:center;text-align:center;color:#ffc64b;font-size:24px;padding:20px}
.poster img{width:100%;height:100%;object-fit:cover}
.video{display:block;background:#000}
.video iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.info{padding:17px}
.info h2{font-size:22px;color:#ffc64b;margin-bottom:7px}
.info p{color:#ccc;font-size:14px;margin-bottom:13px}
.watch{background:#ffc64b;color:#111;margin-top:10px}
.secondary{background:#222;color:#ffc64b;border:1px solid #59421a;margin-top:9px}
.ad-box{text-align:center;overflow:hidden;margin:20px 0}
.small{color:#888;font-size:12px}
footer{text-align:center;padding:24px;color:#888;font-size:12px}
</style>
</head>

<body>
<header>
  <div class="logo">🎬 FUNNYMERRAGELIFE</div>
  <p>বাংলা নাটক • ওয়েব সিরিজ • বিনোদন</p>
</header>

<main class="container">
  <section class="hero">
    <h1>❤️ প্রথম প্রেমের গল্প</h1>
    <p>Episode 1 — নতুন বাংলা সিরিজ</p>
  </section>

  <nav class="categories">
    <button onclick="render('all')">সব শো</button>
    <button onclick="render('natok')">বাংলা নাটক</button>
    <button onclick="render('series')">ওয়েব সিরিজ</button>
    <button onclick="render('india')">ভারতীয় বাংলা</button>
  </nav>

  <!-- Adsterra Native Banner -->
  <div class="ad-box">
    <script async="async" data-cfasync="false"
      src="https://pl31484412.profitableratecpmnetwork.com/74d6c65f6655583e39d66aff51f97c30/invoke.js"></script>
    <div id="container-74d6c65f6655583e39d66aff51f97c30"></div>
  </div>

  <h2 class="section-title">🔥 জনপ্রিয় নাটক ও সিরিজ</h2>
  <div id="showList"></div>

  <p class="small">ভিডিওর প্রাপ্যতা মূল ভিডিও প্রকাশকের ওপর নির্ভরশীল।</p>
</main>

<footer>© 2026 FUNNYMERRAGELIFE</footer>

<script>
const shows = [
  {
    title:"প্রথম প্রেমের গল্প — Episode 1",
    category:"natok",
    description:"নিলয় আলমগীরের প্রথম প্রেমের গল্পের প্রথম পর্ব। ভিডিওটি সরাসরি এই পেজে দেখুন।",
    videoId:"YHo9kG4ssbc"
  },
  {
    title:"শাখা প্রশাখা",
    category:"india",
    description:"ভারতীয় বাংলা রহস্য ও পারিবারিক গল্পের সিরিজ।",
    videoId:"cm_jGXXRtQo"
  },
  {
    title:"কর্মা ক্লিনিক",
    category:"india",
    description:"ভাগ্য ও কর্মফল নিয়ে বাংলা সিরিজ।",
    videoId:"4gSvd_GHBoo"
  },
  {
    title:"Cancel Me Not",
    category:"india",
    description:"বাংলা বিনোদন সিরিজের একটি পর্ব।",
    videoId:"1dfXqR-Hc6M"
  }
];

function render(category="all"){
  const list=document.getElementById("showList");
  list.replaceChildren();

  shows.filter(s=>category==="all"||s.category===category).forEach(s=>{
    const card=document.createElement("article");
    card.className="card";

    const poster=document.createElement("div");
    poster.className="poster";

    const img=document.createElement("img");
    img.src="https://img.youtube.com/vi/"+s.videoId+"/hqdefault.jpg";
    img.alt=s.title+" thumbnail";
    img.loading="lazy";
    img.onerror=()=>{img.remove();poster.textContent="🎬 "+s.title};
    poster.appendChild(img);

    const video=document.createElement("div");
    video.className="video";

    const frame=document.createElement("iframe");
    frame.src="https://www.youtube-nocookie.com/embed/"+s.videoId;
    frame.title=s.title;
    frame.loading="lazy";
    frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    frame.referrerPolicy="strict-origin-when-cross-origin";
    frame.allowFullscreen=true;
    video.appendChild(frame);

    const info=document.createElement("div");
    info.className="info";

    const title=document.createElement("h2");
    title.textContent=s.title;

    const desc=document.createElement("p");
    desc.textContent=s.description;

    const watch=document.createElement("a");
    watch.className="btn watch";
    watch.textContent="▶️ YouTube-এ দেখুন";
    watch.href="https://www.youtube.com/watch?v="+s.videoId;
    watch.target="_blank";
    watch.rel="noopener noreferrer";

    info.append(title,desc,watch);
    card.append(poster,video,info);
    list.appendChild(card);
  });
}

document.querySelectorAll("[data-filter]").forEach(button=>{
  button.addEventListener("click",()=>render(button.dataset.filter));
});

document.querySelectorAll(".categories button").forEach((button,index)=>{
  button.addEventListener("click",()=>{
    render(["all","natok","series","india"][index]);
    document.querySelector(".section-title").scrollIntoView({behavior:"smooth"});
  });
});

render("all");
</script>
</body>
</html>
