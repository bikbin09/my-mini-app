.counter{

.footer{

<script>

/* ==========================================================
   ADSTERRA SMARTLINK
   ========================================================== */

const SMARTLINK =
"https://www.profitableratecpmnetwork.com/c096fxkh3?key=f9977391ed793a6bb843655c43eb6c16";


/* ==========================================================
   BANGLA NATOK LIST
   ========================================================== */

const dramas = [

    {
        title: "ভালোবাসার অভিযান",
        id: "oM2zRwp68Aw",
        description: "নতুন বাংলা নাটক। ভালোবাসা, সম্পর্ক ও জীবনের টানাপোড়েনের গল্প।"
    },

    {
        title: "জাহান্নাম",
        id: "yfDFYmMebQ4",
        description: "সংঘাত, রহস্য, আবেগ ও ভালোবাসার গল্প।"
    },

    {
        title: "এক্স ইক্যুয়ালস টু প্রেম",
        id: "ripZoGxx51M",
        description: "ভালোবাসা ও সম্পর্কের মজার গল্প।"
    },

    {
        title: "আমাদের বিশ্বকাপ",
        id: "fvlwR2zjzJ8",
        description: "বন্ধুত্ব, ভালোবাসা ও ফুটবলকে ঘিরে একটি মজার গল্প।"
    },

    {
        title: "একই ছাদের নিচে",
        id: "DTMwar-8a18",
        description: "সম্পর্ক, পরিবার ও ভালোবাসার গল্প।"
    },

    {
        title: "রংবাজ",
        id: "-YGQUPvjHbo",
        description: "অ্যাকশন, মজা ও রোমান্সে ভরা বাংলা নাটক।"
    },

    {
        title: "অবশেষে তুমি এলে",
        id: "6UC0aptve_Q",
        description: "ভালোবাসার সুন্দর একটি রোমান্টিক গল্প।"
    },

    {
        title: "ঝগড়া হোটেল",
        id: "L-5gWfg9MbU",
        description: "হাসি, মজা ও সম্পর্কের টানাপোড়েনের গল্প।"
    },

    {
        title: "মাইনকার চিপায়",
        id: "g9GRWSbIFck",
        description: "মজার ঘটনা ও রোমান্টিক মুহূর্তে ভরা বাংলা নাটক।"
    },

    {
        title: "বেপরোয়া",
        id: "WseqofclyAI",
        description: "রোমান্স, আবেগ ও নাটকীয়তায় ভরা বাংলা নাটক।"
    }

];


let currentDrama = 0;


/* ==========================================================
   LOAD DRAMA
   ========================================================== */

function loadDrama(index){

    const drama = dramas[index];

    document.getElementById("dramaTitle").innerText =
        drama.title;

    document.getElementById("dramaDescription").innerText =
        drama.description;

    document.getElementById("dramaImage").src =
        "https://i.ytimg.com/vi/" + drama.id + "/maxresdefault.jpg";

    document.getElementById("dramaImage").alt =
        drama.title;


    /*
       ভিডিও শুরুতে লোড থাকবে না।
       PLAY চাপলে ভিডিও লোড হবে।
    */

    document.getElementById("dramaVideo").src =
        "about:blank";


    document.getElementById("playButton").innerText =
        "▶️ PLAY NATOK";


    document.getElementById("counter").innerText =
        "Natok " + (index + 1) + " of " + dramas.length;


    const nextButton =
        document.getElementById("nextButton");


    if(index === dramas.length - 1){

        nextButton.innerText =
            "✓ ALL NATOKS COMPLETED";

        nextButton.disabled = true;

    }else{

        nextButton.innerText =
            "⏭️ NEXT NATOK";

        nextButton.disabled = false;

    }

}


/* ==========================================================
   PLAY NATOK

   1. Adsterra SmartLink নতুন ট্যাবে খুলবে
   2. একই সঙ্গে বর্তমান পেজে ভিডিও চালু হবে
   ========================================================== */

function playDrama(){

    const drama = dramas[currentDrama];


    /* SmartLink খুলবে */

    window.open(
        SMARTLINK,
        "_blank",
        "noopener,noreferrer"
    );


    /* ভিডিও চালু */

    document.getElementById("dramaVideo").src =
        "https://www.youtube.com/embed/" +
        drama.id +
        "?autoplay=1&rel=0";


    document.getElementById("playButton").innerText =
        "▶️ PLAYING...";

}


/* ==========================================================
   NEXT NATOK
   ========================================================== */

function nextDrama(){

    if(currentDrama < dramas.length - 1){

        currentDrama++;

        loadDrama(currentDrama);

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* ==========================================================
   FIRST DRAMA
   ========================================================== */

loadDrama(currentDrama);

</script>
