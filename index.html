  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #030712;
      color: #ffffff;
      padding-bottom: 90px;
    }

    /* --- 2-STEP AGE VERIFICATION OVERLAYS --- */
    .age-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #090814;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .age-overlay-img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      cursor: pointer;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(225, 29, 72, 0.4);
    }

    /* --- TOP BANNER --- */
    .top-banner {
      background: #dc2626;
      color: #fff;
      text-align: center;
      padding: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    /* --- SEARCH BAR --- */
    .search-box {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
    }

    .search-input-wrap {
      flex: 1;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input-wrap input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      width: 100%;
    }

    .search-input-wrap i {
      color: #64748b;
    }

    .search-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-weight: 700;
      font-size: 13px;
    }

    /* --- PAGINATION GRID --- */
    .pag-oval-container {
      margin: 8px 16px 16px 16px;
      padding: 12px 8px;
      border: 1px solid #1e293b;
      border-radius: 35px;
      background: rgba(15, 23, 42, 0.6);
    }

    .pag-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      row-gap: 10px;
      justify-items: center;
    }

    .pag-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #020617;
      border: 1px solid #1e293b;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }

    .pag-circle.active {
      background: #f97316;
      border-color: #f97316;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.7);
    }

    /* --- VIDEO CARDS --- */
    .card-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
    }

    .card-media-wrapper {
      position: relative;
      width: 100%;
      height: 300px;
      background: #000;
      overflow: hidden;
    }

    .card-media-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #f97316;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      z-index: 3;
    }

    .play-trigger {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: #f43f5e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.8);
      z-index: 3;
      text-decoration: none;
      padding-left: 3px;
    }

    .card-btn-bar {
      display: flex;
      padding: 12px;
      gap: 10px;
      background: #0f172a;
    }

    .c-btn {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .c-btn-play {
      background: #2563eb;
      color: #fff;
    }

    .c-btn-down {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }

    /* --- FLOATING TELEGRAM BUTTON --- */
    .floating-join-wrap {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 9999;
    }

    .join-pill-btn {
      width: 100%;
      background: rgba(15, 23, 42, 0.95);

      border-radius: 30px;
      padding: 12px 18px;

      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
    }

    .tg-circle {
      width: 30px;
      height: 30px;
      background: #0ea5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
  </style>
