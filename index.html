<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #070b14;
      color: #ffffff;
      padding-bottom: 90px;
      -webkit-tap-highlight-color: transparent;
    }

    /* Top Search Header */
    .search-container {
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: #070b14;
    }

    .search-bar {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 25px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-bar i {
      color: #9ca3af;
      font-size: 16px;
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      width: 100%;
    }

    .search-btn {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Number Pagination Wrapper */
    .pagination-box {
      margin: 10px 16px;
      padding: 14px 10px;
      border: 1px solid #1e293b;
      border-radius: 30px;
      background: rgba(15, 23, 42, 0.6);
    }

    .pagination-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      row-gap: 12px;
      justify-items: center;
    }

    .num-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .num-btn.active {
      background: #f97316;
      border-color: #f97316;
      color: #fff;
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.6);
    }

    /* Content Cards */
    .content-area {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: 10px;
    }

    .video-card {
      background: #0f172a;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    /* Collage Grid Frame */
    .thumb-grid {
      position: relative;
      width: 100%;
      height: 220px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      background: #000;
      overflow: hidden;
    }

    .thumb-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-grid img.span-large {
      grid-row: span 2;
    }

    .card-num-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #f97316;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      z-index: 2;
    }

    .center-play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      background: #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
      z-index: 2;
      text-decoration: none;
      padding-left: 3px;
    }

    /* Action Buttons */
    .card-footer-btns {
      display: flex;
      padding: 12px;
      gap: 12px;
      background: #0f172a;
    }

    .action-btn {
      flex: 1;
      padding: 11px;
      border-radius: 22px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
    }

    .play-btn {
      background: #3b82f6;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
    }

    .download-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }

    /* Floating Telegram Join Box */
    .floating-telegram-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 400px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid #38bdf8;
      border-radius: 30px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      z-index: 999;
      text-decoration: none;
      color: #fff;
    }

    .tg-icon-circle {
      width: 32px;
      height: 32px;
      background: #0284c7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .tg-text {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sparkle {
      color: #facc15;
    }

    /* Top Red Notice Banner */
    .top-notice {
      background: #dc2626;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
    }

    .top-notice marquee {
      vertical-align: middle;
    }
  </style>
</head>
